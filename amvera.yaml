version: 2
meta:
  name: contact-bot
  environment: python
  toolchain:
    name: pip
    version: "3.10"
deploy:
  type: python
  command: pip install -r requirements.txt && python app.py
  environment:
    - name: BOT_TOKEN
      value: ${BOT_TOKEN}
    - name: DATABASE_URL
      value: ${DATABASE_URL}